version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./artifacts:/app/artifacts
      - ./evaluation:/app/evaluation
    environment:
      - REDIS_URL=redis://redis:6379
      - MOCK_GEMINI=1
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    volumes:
      - ./storage:/app/storage
      - ./artifacts:/app/artifacts
    environment:
      - REDIS_URL=redis://redis:6379
      - MOCK_GEMINI=1
    depends_on:
      - redis

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./storage:/app/storage
      - ./artifacts:/app/artifacts
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
